name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Keyboard and ARIA tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
