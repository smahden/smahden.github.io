      <stop offset="0%" stop-color="#141d33"/>
      <stop offset="100%" stop-color="#12303f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#ems-bg)"/>

  <!-- stylized record table -->
  <g opacity="0.5">
    <rect x="700" y="150" width="430" height="70" rx="10" fill="#5eead4" fill-opacity="0.22"/>
    <rect x="700" y="240" width="430" height="60" rx="10" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="700" y="316" width="430" height="60" rx="10" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="700" y="392" width="430" height="60" rx="10" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="700" y="468" width="430" height="60" rx="10" fill="#ffffff" fill-opacity="0.06"/>
    <g fill="#5eead4" opacity="0.75">
      <circle cx="735" cy="270" r="14"/>
      <circle cx="735" cy="346" r="14"/>
      <circle cx="735" cy="422" r="14"/>
      <circle cx="735" cy="498" r="14"/>
    </g>
    <g fill="#8593b3">
      <rect x="770" y="262" width="200" height="16" rx="8"/>
      <rect x="770" y="338" width="240" height="16" rx="8"/>
      <rect x="770" y="414" width="170" height="16" rx="8"/>
