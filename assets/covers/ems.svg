  <text x="90" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" fill="#8593b3" font-weight="600">ToonCity internship</text>
  <text x="90" y="300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" fill="#f2f6ff" font-weight="800">Employee</text>
  <text x="90" y="386" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" fill="#f2f6ff" font-weight="800">Management</text>
  <text x="90" y="452" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" fill="#cfd8ee" font-weight="500">RESTful CRUD · relational schema</text>

  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="30" fill="#5eead4">
