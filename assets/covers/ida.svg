<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="IDA — adaptive learning platform">
  <defs>
    <linearGradient id="ida-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141d33"/>
      <stop offset="100%" stop-color="#241b4a"/>
    </linearGradient>
    <linearGradient id="ida-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#ida-bg)"/>

  <!-- adaptive path: a branching learning route -->
  <g fill="none" stroke="url(#ida-line)" stroke-width="5" opacity="0.55">
    <path d="M120 620 C 300 620, 320 470, 470 470 S 700 470, 780 350"/>
    <path d="M470 470 C 620 470, 660 600, 830 600" opacity="0.5"/>
    <path d="M780 350 C 880 250, 980 260, 1080 200" opacity="0.8"/>
  </g>
  <g fill="#5eead4">
    <circle cx="120" cy="620" r="13"/>
    <circle cx="470" cy="470" r="13"/>
    <circle cx="830" cy="600" r="10" opacity="0.6"/>
    <circle cx="780" cy="350" r="13"/>
    <circle cx="1080" cy="200" r="17" fill="#a78bfa"/>
  </g>

  <text x="90" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" fill="#8593b3" font-weight="600">Thesis project</text>
  <text x="90" y="272" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="82" fill="#f2f6ff" font-weight="800">IDA</text>
  <text x="90" y="345" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" fill="#cfd8ee" font-weight="500">Adaptive Grade 4 Mathematics</text>

  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="30" fill="#a78bfa">
    <rect x="90" y="392" width="230" height="52" rx="26" fill="#a78bfa" fill-opacity="0.14"/>
    <text x="115" y="427">React (Vite)</text>
    <rect x="338" y="392" width="120" height="52" rx="26" fill="#a78bfa" fill-opacity="0.14"/>
    <text x="363" y="427">PHP</text>
    <rect x="476" y="392" width="160" height="52" rx="26" fill="#a78bfa" fill-opacity="0.14"/>
    <text x="501" y="427">MySQL</text>
  </g>
</svg>
